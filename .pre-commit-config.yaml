# Formato (prettier para TS/JSON/MD/YAML) + chequeo de sintaxis
# (typecheck: tsc --noEmit vía bun) e higiene básica.
# Instalar una vez: pre-commit install
# Reformateo único: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        additional_dependencies: [prettier@3.9.6]
        files: \.(ts|tsx|js|mjs|json|md|yml|yaml)$
        exclude: (^|/)bun\.lock$ # generado por bun, no reformatear

  - repo: local
    hooks:
      - id: typecheck
        name: typecheck (tsc --noEmit)
        entry: bun run typecheck
        language: system
        pass_filenames: false
        files: \.tsx?$

      # plugin/tui.js es un artefacto generado que se publica: lo commiteamos
      # ya compilado porque el workflow de publish no tiene paso de build.
      # Regenerarlo aquí cuando cambie la fuente.
      - id: build-tui
        name: build tui.js (bun build)
        entry: bun run build:tui
        language: system
        pass_filenames: false
        files: ^plugin/tui\.tsx$
