name: update-pricing

# Manual-only by contract: the official rate card changes through a human
# decision, so there is no schedule. The owner triggers a run from the
# Actions tab or `gh workflow run update-pricing`.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update-pricing:
    runs-on: [self-hosted, dockerless]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Refresh pricing from the live rate card
        run: bun scripts/update-pricing.ts

      - name: Validate catalog and pricing before publishing
        run: bun scripts/validate-catalog.ts

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain catalog/pricing.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog/pricing.json
            git commit -m "chore: refresh ollama cloud pricing"
            git push
            # pricing.json ships to plugin users through jsDelivr; without the
            # purge the CDN may serve stale rates until its TTL expires.
            curl -sfS "https://purge.jsdelivr.net/gh/srnoob2570/opencode-ollama-cloud@main/catalog/pricing.json" \
              || echo "::warning::jsDelivr purge failed; CDN may serve stale rates until its TTL expires"
          else
            echo "Pricing unchanged, nothing to commit"
          fi
