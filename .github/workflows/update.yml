name: update-catalog

on:
  # scheduled from the self-hosted runner's crontab via workflow_dispatch API
  # (GitHub's `schedule` trigger silently drops runs under load)
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, catalog-dockerless]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Update catalog (skips scraping if model list unchanged)
        run: bun scripts/update-catalog.ts update

      - name: Validate catalog before publishing
        run: bun scripts/validate-catalog.ts

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain catalog/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog/
            git commit -m "chore: refresh ollama cloud catalog"
            git push
            curl -sfS "https://purge.jsdelivr.net/gh/srnoob2570/opencode-ollama-cloud@main/catalog/catalog.json" \
              || echo "::warning::jsDelivr purge failed; CDN may serve a stale catalog until its TTL expires"
          else
            echo "Catalog unchanged, nothing to commit"
          fi
